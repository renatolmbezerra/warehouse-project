warehouse_dbt:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ':memory:' # Usa a memória RAM para processar tudo super rápido
      threads: 6
      extensions:
        - httpfs # Necessário para ler/escrever no S3
      secrets:
        - type: s3
          region: "{{ env_var('AWS_REGION') }}"
          key_id: "{{ env_var('AWS_ACCESS_KEY_ID') }}"
          secret: "{{ env_var('AWS_SECRET_ACCESS_KEY') }}"
